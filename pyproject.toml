[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cib-rank"
version = "0.1.0"
description = "Rank Twitter topics by coordinated / inauthentic engagement (NoSQL project: HBase + Kafka)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "kafka-python>=2.0.2",
    "happybase>=1.2.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cib_rank*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
